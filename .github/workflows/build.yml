name: Build Desktop Installers

# 构建桌面安装包：仅 Windows x64 与 macOS Apple Silicon
# 触发条件：推送到 main/master 分支，或手动运行
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3...) — macos-14 runner 原生 arm64
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
          # Windows x64 — windows-latest runner 原生 x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          # CI 环境默认会传 --skip-jenkins 跳过 DMG 的 AppleScript 布局，
          # 导致 DMG 无图标位置。置此变量让布局照常执行（生成 .DS_Store）。
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Upload macOS installers
        if: matrix.platform == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: CompanionPet-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload Windows installers
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: CompanionPet-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
